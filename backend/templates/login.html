{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>

<form method="POST">
  <label>Usuario:</label>
  <input type="text" name="username" required>
  <label>Contraseña:</label>
  <input type="password" name="password" required>
  <button type="submit">Login</button>
</form>
{% endblock %}
