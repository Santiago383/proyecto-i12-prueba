<!DOCTYPE html>
<html>
<head>
  <title>Mapa con Leaflet - Intersecciones</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link id="main-css" rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div id="form-container">
    <h2>Agregar intersección</h2>
    <form id="locationForm">
      <label>Nombre del lugar:</label>
      <input type="text" id="name" placeholder="Ej: Esquina importante" required />

      <label>Intersección (Calle 1 y Calle 2):</label>
      <input type="text" id="intersection" placeholder="Ej: Calle 2 esquina 62, La Plata" required />

      <button type="submit">Agregar al mapa</button>

      <input type="file" id="foto" accept="image/*">
      <div id="file-name">Ningún archivo seleccionado</div>
    </form>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/functions.js') }}"></script>
  <script>
  const ts = new Date().getTime();
  const script = document.createElement("script");
  script.src = "/static/functions.js?v=" + ts;
  document.head.appendChild(script);
  </script>

</body>
</html>
