<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ResiduosApp{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    .container {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Estilo global para todos los inputs */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      margin: 6px 0 12px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      font-size: 1em;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 16px;
      margin-top: 40px;
      background: #f0f0f0;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Navbar común en todas las páginas -->
  {% include "_navbar.html" %}

  <!-- Contenido específico de cada página -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer común -->
  <footer>
    <p>&copy; 2025 ResiduosApp</p>
  </footer>
</body>
</html>
